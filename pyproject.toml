[project]
name = "suryahimal"
version = "1.0.0"
description = "Autonomous Agentic AI Framework for Clean Energy Access and Microgrid Optimization in Off-Grid Himalayan Communities"
authors = [{ name = "UPES School of Computer Science" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "langgraph>=0.2.50",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "groq>=0.13.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
